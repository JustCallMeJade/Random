name: Wine termux

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v4

      - name: Enable i386
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update

      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            debootstrap \
            perl \
            git \
            wget \
            xz-utils \
            bubblewrap \
            autoconf \
            automake \
            flex \
            bison \
            pkg-config \
            make \
            gcc \
            g++ \
            gcc-multilib \
            g++-multilib \
            clang \
            lld \
            mingw-w64 \
            libx11-dev \
            libxext-dev \
            libxi-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxfixes-dev \
            libxrender-dev \
            libxinerama-dev \
            libxxf86vm-dev \
            libgl-dev \
            libglu1-mesa-dev \
            libosmesa6-dev \
            libsdl2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libpcap-dev \
            libdbus-1-dev \
            libssl-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            libcups2-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libxml2-dev \
            libvulkan-dev \
            vulkan-tools \
            libvulkan1 \
            mesa-vulkan-drivers \
            gettext \
            libgettextpo-dev \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libmpg123-dev \
            libopenal-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libkrb5-dev

          sudo apt-get install -y \
            libfreetype6-dev:i386 \
            libfontconfig1-dev:i386 \
            libx11-dev:i386 \
            libxext-dev:i386 \
            libxi-dev:i386 \
            libxrandr-dev:i386 \
            libxcursor-dev:i386 \
            libxcomposite-dev:i386 \
            libxdamage-dev:i386 \
            libxfixes-dev:i386 \
            libxrender-dev:i386 \
            libxinerama-dev:i386 \
            libxxf86vm-dev:i386 \
            libgl-dev:i386 \
            libsdl2-dev:i386 \
            libpulse-dev:i386 \
            libvulkan-dev:i386 \
            libgstreamer1.0-dev:i386 \
            libgstreamer-plugins-base1.0-dev:i386 \
            libkrb5-dev:i386

      - name: Run build script
        run: |
          bash Wine-termux.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: termux-wine
          name: Wine termux
          generate_release_notes: true
          files: Workdir/Builds/*.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
